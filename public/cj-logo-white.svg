<svg xmlns="http://www.w3.org/2000/svg" viewBox="86 101 308 303" width="616" height="606" role="img" aria-label="CJ logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Cuts a clean gap in the C wherever the J passes over it -->
    <mask id="cutC" maskUnits="userSpaceOnUse" x="-100" y="-100" width="800" height="800">
      <rect x="-100" y="-100" width="800" height="800" fill="#fff"/>
      <path d="M345 215 V305 A55 55 0 0 1 235 305" fill="none" stroke="#000" stroke-width="72" stroke-linecap="round"/>
      <circle cx="290" cy="305" r="32" fill="#000"/>
    </mask>
  </defs>

  <!-- C -->
  <path d="M269.6 209.9 A85 85 0 1 0 269.6 340.1" fill="none" stroke="#FFFFFF" stroke-width="48"
        stroke-linecap="round" mask="url(#cutC)"/>
  <!-- J -->
  <path d="M345 215 V305 A55 55 0 0 1 235 305" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round"/>

  <!-- Circuit node as the dot of the J -->
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M316 150 a29 29 0 1 0 58 0 a29 29 0 1 0 -58 0 Z M333 150 a12 12 0 1 1 24 0 a12 12 0 1 1 -24 0 Z"/>
  <circle cx="345" cy="150" r="5" fill="#FFFFFF"/>
</svg>
